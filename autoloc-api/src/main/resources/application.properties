spring.application.name=autoloc-api

# Connexion à la base de données MySQL
# (identifiants lus dans les variables d'environnement DB_USERNAME / DB_PASSWORD ; valeurs par défaut : root / mot de passe vide)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA (réglages de développement uniquement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
